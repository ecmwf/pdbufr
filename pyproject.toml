[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "setuptools-scm[toml]>=8"]

[project]
authors = [
  {name = "European Centre for Medium-Range Weather Forecasts (ECMWF)", email = "software.support@ecmwf.int"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython"
]
dependencies = ["attrs", "eccodes", "pandas", "pint"]
description = "Pandas reader for the BUFR format using ecCodes."
dynamic = ["version"]
keywords = ["bufr", "eccodes", "pandas"]
license = {text = "Apache License Version 2.0"}
name = "pdbufr"
readme = "README.md"
requires-python = ">=3.9"
optional-dependencies.dev = [
  "pdbufr[docs,tests]"
]
optional-dependencies.docs = [
  "nbsphinx",
  "pygments>=2.6.1",
  "sphinx>=7.3.7",
  "sphinx-copybutton",
  "sphinx-issues",
  "sphinx-rtd-theme"
]
optional-dependencies.tests = ["nbconvert", "nbformat", "pytest", "pytest-cov", "requests"]
urls.Documentation = "https://pdbufr.readthedocs.io/en/latest/"
urls.Homepage = "https://github.com/ecmwf/pdbufr"

[tool.coverage.run]
branch = true

[tool.pydocstyle]
add_ignore = ["D1", "D200", "D205", "D400", "D401"]
convention = "numpy"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
ignore = [
  "D1",  # pydocstyle: Missing Docstrings
  "D107",  # pydocstyle: numpy convention
  "D203",
  "D205",
  "D212",
  "D213",
  "D401",
  "D402",
  "D413",
  "D415",
  "D416",
  "D417"
]
select = [
  "F",  # pyflakes
  "E",  # pycodestyle
  "W",  # pycodestyle warnings
  "I",  # isort
  "D"  # pydocstyle
]

[tool.setuptools_scm]
version_file = "src/pdbufr/_version.py"
