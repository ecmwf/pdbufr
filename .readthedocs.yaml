version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.11"
  jobs:
    post_checkout:
    - git fetch --unshallow || true
    pre_build:
    - rm -rf _build
    - rm -rf docs/_build
    - cd docs
python:
  install:
  - method: pip
    path: .
    extra_requirements:
    - docs

sphinx:
  configuration: docs/source/conf.py
